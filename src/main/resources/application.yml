server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: gogo-travel-agent
  config:
    import:
      - classpath:city-tier.yml
      - classpath:intent-seed.yml
      - optional:classpath:application-local.yml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6381}
      password: "${REDIS_PASSWORD:}"
      database: 0
      username: "${REDIS_USERNAME:}"

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "${DB_URL:jdbc:mysql://localhost:3306/corporate_travel?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}"
    username: "${DB_USERNAME:}"
    password: "${DB_PASSWORD:}"
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      test-while-idle: true
      validation-query: SELECT 1
      stat-view-servlet:
        enabled: false
        url-pattern: /druid/*
        login-username: admin
        login-password: admin

mybatis-plus:
  type-handlers-package: com.gogo.travel.config
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      id-type: input
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.gogo.travel: INFO # 需要排查问题时改为DEBUG，我们打了很多DEBUG日志用于观察agent运行情况
    io.agentscope.core: INFO

travel:
  skill:
    path: classpath:skills

# 外部联网查询配置
# API Key 加密存储配置（生产环境请通过环境变量注入强密钥）
app:
  database-name: ${DB_NAME:corporate_travel}
  knowledge:
    pgvector:
      url: ${PGVECTOR_URL:jdbc:postgresql://127.0.0.1:25432/corporate_travel}
      username: ${PGVECTOR_USERNAME:corporate_travel}
      password: ${PGVECTOR_PASSWORD:}
      dimensions: 1024
      embedding-model: ${KNOWLEDGE_EMBEDDING_MODEL:text-embedding-v4}
      initialize-schema: ${KNOWLEDGE_INITIALIZE_SCHEMA:true}
      import-on-startup: ${KNOWLEDGE_IMPORT_ON_STARTUP:false}
  langfuse:
    enabled: ${LANGFUSE_ENABLED:false}
    capture-content: ${LANGFUSE_CAPTURE_CONTENT:false}
    environment: ${LANGFUSE_ENVIRONMENT:local}
  api-key-encrypt-secret: ${API_KEY_ENCRYPT_SECRET:local-development-only-change-before-use}
  # MinIO 对象存储：保存行程方案 HTML
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:gogo-travel}
  # NewsData.io API Key，用于目的地资讯查询（query_destination_news 工具）
  # 免费注册地址：https://newsdata.io，免费额度 200 次/天
  # 未配置时该工具会优雅降级，不影响其他功能
  news-api-key: ${NEWS_API_KEY:}
  weather-mcp:
    enabled: ${WEATHER_MCP_ENABLED:false}
    # 天气 MCP Streamable HTTP 端点（阿里云云市场网关地址，含 AppCode 鉴权）
    endpoint: ${WEATHER_MCP_ENDPOINT:http://mcpservergateway.market.alicloudapi.com/mcpnacos/cmapi00074002/xxxxxxxxx}  # 记得改成你自己的
    # 天气 MCP 工具白名单（逗号分隔的工具名称）
    # 当前选定 6 个差旅核心工具（省略 POI/经纬度类、长期预报、生活指数等）：
    enabled-tools: 城市天气实况,城市15日预报,城市天气预警,城市空气实况,城市24小时预报,城市40日预报

  # Orizn Visa MCP：通过 stdio 方式启动 npx -y orizn-visa-mcp 进程
  # 覆盖 39,585 个护照-目的地对的签证要求，支持 15 种语言
  # 免费版（不配 API Key）只能使用 quick_visa_check 与 get_coverage_stats
  # 注册 API Key：https://visa.orizn.app
  orizn-mcp:
    # 启动命令（绝对路径优先，避免 PATH 找不到）。也可直接用 npx。
    command: ${ORIZN_MCP_COMMAND:npx}
    # 命令参数（逗号分隔）。默认 npx -y orizn-visa-mcp
    args: ${ORIZN_MCP_ARGS:-y,orizn-visa-mcp}
    # Orizn Visa API Key（env 形式注入子进程）。未配置时走免费模式，仅暴露两个免费工具
    api-key: ${ORIZN_API_KEY:}  # 记得改成你自己的
    # MCP 工具白名单（逗号分隔）。
    # 留空则暴露 Orizn 服务端声明的全部工具（按需 + 免费）；
    # 非空则只向 LLM 暴露白名单内的工具，减少 Token 消耗。
    # 默认：仅暴露免费版可用的两个工具，避免调用付费工具时反复报错
    enabled-tools: ${ORIZN_MCP_ENABLED_TOOLS:quick_visa_check,check_visa_requirement}
    # MCP 初始化握手超时
    initialization-timeout-seconds: 20
    # 工具调用请求超时
    request-timeout-seconds: 30

  # 工具维度熔断降级配置。
  # 当某个受监控的 tool 连续失败达到阈值时，自动从 toolkit 中卸载该 tool；
  # 冷却期（指数退避）结束后在下次推理前重新激活。
  # 分布式场景下使用 Redis 共享失败计数与冷却时间。
  circuit-breaker:
    # 是否启用 tool 维度熔断。默认关闭，按需开启。
    enabled: ${TOOL_CB_ENABLED:true}
    # 受监控的 tool 名称白名单（逗号分隔）。只有在此列表中的 tool 才会被熔断。
    # 例：tuniuHotelSearch, flyaiFlightSearch —— 接外部接口/慢依赖的 tool 按需添加。
    monitored-tool-names: ${TOOL_CB_MONITORED_NAMES:query_weather,query_destination_news}
    # 触发降级的连续失败次数阈值。
    failure-threshold: 3
    # 初始冷却时间（秒）。
    initial-cooldown-seconds: 60
    # 指数退避倍数。
    backoff-multiplier: 2.0
    # 冷却时间上限（秒），避免指数退避无限增长。
    max-cooldown-seconds: 600
    # Redis Key 前缀，区分不同环境。
    redis-key-prefix: "tool:cb:"
    # 状态 TTL（秒），仅用于清理长期未触发的脏数据。
    state-ttl-seconds: 86400

agentscope:
  dashscope:
    api-key: "${DASHSCOPE_API_KEY:}" # 通过环境变量注入，避免把密钥写入源码或构建产物
    models:
      fast: "${DASHSCOPE_FAST_MODEL:qwen-flash}"
      strong: "${DASHSCOPE_STRONG_MODEL:qwen-flash}"
      stable: "${DASHSCOPE_STABLE_MODEL:qwen-flash}"
  memory:
    mem0:
      enabled: ${MEM0_ENABLED:true}
      api-base-url: ${MEM0_API_BASE_URL:http://127.0.0.1:18888}
      api-key: ${MEM0_API_KEY:}
      api-type: ${MEM0_API_TYPE:self-hosted}
      timeout: ${MEM0_TIMEOUT:30s}
      agent-name: corporate-travel-platform

# Sa-Token 配置
sa-token:
  # Token 名称，前端需在请求头中携带
  token-name: Authorization
  # Token 有效期（2592000 = 30 天）
  timeout: 2592000
  # 动态 Token 活跃续期：每次请求重置倒计时，-1 表示不续期
  active-timeout: -1
  # 是否允许同一账号多地登录
  is-concurrent: true
  # 相同用户相同端多次登录是否共用同一 Token
  is-share: false
  # Token 风格：随机 128 位
  token-style: random-128
  # 关闭启动日志
  is-print: false

# OpenTelemetry / Actuator observability. Traces are sent via OTLP HTTP to the
# local Collector; metrics remain scrapeable by Prometheus at /actuator/prometheus.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    enabled: ${TRACING_ENABLED:true}
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://127.0.0.1:25318/v1/traces}
    metrics:
      export:
        enabled: ${OTEL_METRICS_EXPORT_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://127.0.0.1:24320/v1/metrics}
        step: ${OTEL_METRICS_EXPORT_STEP:10s}
