name: corporate-travel-business
services:
  mysql:
    image: mysql:8.0.43
    environment:
      MYSQL_DATABASE: corporate_travel
      MYSQL_USER: corporate_travel
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run scripts/init-integrations.ps1}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
    ports: ["127.0.0.1:23306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-business.sql:ro
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u corporate_travel -e "SELECT 1" corporate_travel']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes']
    ports: ["127.0.0.1:6381:6379"]
    volumes: ["redis_data:/data"]
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-corporate-travel}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?required}
    command: ["server", "/data", "--console-address", ":9001"]
    ports: ["127.0.0.1:29000:9000", "127.0.0.1:29001:9001"]
    volumes: ["minio_data:/data"]
    restart: unless-stopped
volumes:
  mysql_data:
  redis_data:
  minio_data:
