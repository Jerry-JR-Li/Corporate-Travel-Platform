receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  filter/langfuse:
    error_mode: ignore
    traces:
      span:
        - 'attributes["langfuse.observation.type"] == nil'
  transform/langfuse:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(parent_span_id, SpanID(0x0000000000000000)) where name == "agent.run"
  batch:
    timeout: 2s
    send_batch_size: 64
exporters:
  otlphttp/langfuse:
    traces_endpoint: ${env:LANGFUSE_OTEL_TRACES_ENDPOINT}
    headers:
      Authorization: ${env:LANGFUSE_OTEL_AUTH}
      x-langfuse-ingestion-version: "4"
    timeout: 10s
    compression: gzip
    sending_queue:
      enabled: true
      queue_size: 256
    retry_on_failure:
      enabled: true
      max_elapsed_time: 300s
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/langfuse, transform/langfuse, batch]
      exporters: [otlphttp/langfuse]
